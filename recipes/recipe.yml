name: arma-os
description: "ARMA OS - Mac-level Security with Android Features"

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  - type: script
    snippets:
      - 'sed -i "s/NAME=.*/NAME=\"ARMA OS\"/" /usr/lib/os-release'
      - 'sed -i "s/PRETTY_NAME=.*/PRETTY_NAME=\"ARMA OS 1.0 (Aegis Edition)\"/" /usr/lib/os-release'

  - type: dnf
    install:
      packages:
        - waydroid
        - usbguard
        - firewalld
        - kdeconnectd

  - type: default-flatpaks
    notify: true
    system:
      install:
        - org.mozilla.firefox
        - com.github.tchx84.Flatseal

  - type: systemd
    system:
      enabled:
        - waydroid-container.service
        - firewalld.service
