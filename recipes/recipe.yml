name: arma-os
description: "ARMA OS 1.0 - Apex AI-ML Workstation (Mac Boot & Security + Kali Pentest)"

base-image: ghcr.io/ublue-os/kinoite-main
image-version: latest

modules:
  # 1. Package Arsenal First (Ensures plymouth, chafa, and tools are present)
  - type: dnf
    install:
      packages:
        # High-Resolution Terminal Image Renderer & Monitors
        - chafa
        - fastfetch
        - btop
        # AI/ML Development Stack
        - git
        - python3
        - python3-pip
        - podman-compose
        - distrobox
        # Kali Ethical Hacking & Security Tools
        - nmap
        - wireshark-cli
        - tcpdump
        - aircrack-ng
        - hydra
        - john
        - socat
        # Hardware & Network Armor
        - usbguard
        - firewalld
        - plymouth-theme-spinner

  # 2. System Identity, Mac Boot Splash, & Security Configuration
  - type: script
    snippets:
      # Download Master Emblem
      - 'mkdir -p /usr/share/pixmaps'
      - 'curl -sLo /usr/share/pixmaps/arma-logo.png https://raw.githubusercontent.com/HARIHARASUDHAN-M-AIML/arma-os/main/arma-logo.png'
      
      # macOS Style Boot Screen (Ensures directories exist first)
      - 'mkdir -p /usr/share/plymouth/themes/spinner /usr/share/plymouth/themes/bgrt /etc/plymouth'
      - 'cp -f /usr/share/pixmaps/arma-logo.png /usr/share/plymouth/themes/spinner/bgrt-fallback.png'
      - 'cp -f /usr/share/pixmaps/arma-logo.png /usr/share/plymouth/themes/bgrt/bgrt-fallback.png'
      - 'rm -f /usr/share/plymouth/themes/spinner/watermark.png'
      - 'touch /usr/share/plymouth/themes/spinner/watermark.png'
      - 'echo -e "[Daemon]\nTheme=spinner\nShowDelay=0\nDeviceTimeout=8" > /etc/plymouth/plymouthd.conf'
      
      # Terminal Emblem via Chafa
      - 'rm -f /etc/arma-logo.txt'
      - 'sed -i "/fastfetch/d" /etc/bashrc'
      - 'echo "tty -s && fastfetch --logo /usr/share/pixmaps/arma-logo.png --logo-type chafa --logo-width 34" >> /etc/bashrc'
      
      # Official ARMA OS Identity
      - 'sed -i "s/NAME=.*/NAME=\"ARMA OS\"/" /usr/lib/os-release'
      - 'sed -i "s/PRETTY_NAME=.*/PRETTY_NAME=\"ARMA OS 1.0 (Apex AI-ML Workstation)\"/" /usr/lib/os-release'
      - 'sed -i "s/ID=.*/ID=\"arma-os\"/" /usr/lib/os-release'
      - 'echo "ARMA OS 1.0 (Apex AI-ML Workstation)" > /etc/fedora-release'
      - 'echo "ARMA OS 1.0 (Apex AI-ML Workstation)" > /etc/system-release'
      - 'echo "ARMA OS 1.0 (Apex AI-ML Workstation)" > /etc/issue'
      
      # Privacy & Kernel Exploit Protection
      - 'mkdir -p /etc/NetworkManager/conf.d /etc/sysctl.d'
      - 'echo -e "[device]\nwifi.scan-rand-mac-address=yes\n[connection]\nwifi.cloned-mac-address=random" > /etc/NetworkManager/conf.d/99-arma-privacy.conf'
      - 'echo -e "kernel.kptr_restrict=2\nkernel.dmesg_restrict=1\nnet.ipv4.tcp_syncookies=1\nnet.ipv4.conf.all.accept_redirects=0" > /etc/sysctl.d/99-arma-security.conf'

  # 3. Enable Core Security Daemons on Boot
  - type: systemd
    system:
      enabled:
        - firewalld.service
